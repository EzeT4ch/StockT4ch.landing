upstream stocktech_web {
    server web:4321;
    keepalive 16;
}

server {
    listen 80;
    server_name stocktech.com.ar www.stocktech.com.ar;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://stocktech.com.ar$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.stocktech.com.ar;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/stocktech.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stocktech.com.ar/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://stocktech.com.ar$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name stocktech.com.ar;
    server_tokens off;

    client_max_body_size 32k;
    client_body_timeout 10s;
    keepalive_timeout 30s;

    ssl_certificate /etc/letsencrypt/live/stocktech.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stocktech.com.ar/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location /_astro/ {
        proxy_pass http://stocktech_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /health/ {
        proxy_pass http://stocktech_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        access_log off;
    }

    location / {
        proxy_pass http://stocktech_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 30s;
        add_header Cache-Control "private, no-store" always;
    }
}
