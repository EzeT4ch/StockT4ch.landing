name: stocktech-commercial

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4321
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?PUBLIC_SITE_URL es obligatoria}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?PUBLIC_APP_URL es obligatoria}
      PUBLIC_CONTACT_EMAIL: ${PUBLIC_CONTACT_EMAIL:?PUBLIC_CONTACT_EMAIL es obligatoria}
      PUBLIC_WHATSAPP_NUMBER: ${PUBLIC_WHATSAPP_NUMBER:?PUBLIC_WHATSAPP_NUMBER es obligatoria}
      LEGAL_DATA_CONTROLLER_NAME: ${LEGAL_DATA_CONTROLLER_NAME:?LEGAL_DATA_CONTROLLER_NAME es obligatoria}
      LEGAL_ADDRESS: ${LEGAL_ADDRESS:?LEGAL_ADDRESS es obligatoria}
      LEGAL_JURISDICTION: ${LEGAL_JURISDICTION:?LEGAL_JURISDICTION es obligatoria}
      LEGAL_LAST_UPDATED: ${LEGAL_LAST_UPDATED:?LEGAL_LAST_UPDATED es obligatoria}
      LEGAL_PRIVACY_VERSION: ${LEGAL_PRIVACY_VERSION:?LEGAL_PRIVACY_VERSION es obligatoria}
      LEAD_RETENTION_MONTHS: ${LEAD_RETENTION_MONTHS:?LEAD_RETENTION_MONTHS es obligatoria}
      SITE_MODE: ${SITE_MODE:-prelaunch}
      TRIAL_DAYS: ${TRIAL_DAYS:-15}
      FOUNDERS_SLOTS: ${FOUNDERS_SLOTS:-10}
      FOUNDERS_DISCOUNT: ${FOUNDERS_DISCOUNT:-20}
      EXPERIMENTS_ENABLED: ${EXPERIMENTS_ENABLED:-true}
      EXPERIMENT_HERO_ENABLED: ${EXPERIMENT_HERO_ENABLED:-true}
      EXPERIMENT_HERO_WEIGHT_A: ${EXPERIMENT_HERO_WEIGHT_A:-50}
      EXPERIMENT_HERO_WEIGHT_B: ${EXPERIMENT_HERO_WEIGHT_B:-50}
      ANALYTICS_ENABLED: ${ANALYTICS_ENABLED:-false}
      ANALYTICS_DEBUG: ${ANALYTICS_DEBUG:-false}
      GA4_MEASUREMENT_ID: ${GA4_MEASUREMENT_ID:-}
      META_PIXEL_ID: ${META_PIXEL_ID:-}
      LEAD_EMAIL_TO: ${LEAD_EMAIL_TO:?LEAD_EMAIL_TO es obligatoria}
      LEAD_EMAIL_FROM: ${LEAD_EMAIL_FROM:?LEAD_EMAIL_FROM es obligatoria}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST es obligatoria}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?SMTP_USER es obligatoria}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD es obligatoria}
      SMTP_SECURE: ${SMTP_SECURE:-false}
    expose:
      - "4321"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4321/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 3s
      start_period: 10s
      retries: 3

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - public
      - internal
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health/live"]
      interval: 20s
      timeout: 3s
      retries: 3

networks:
  public:
  internal:
    internal: true
